# ==============================================================================
# Ollama — PersistentVolume + PersistentVolumeClaim + Deployment + Service
#
# Storage strategy (KTHW has no dynamic provisioner):
#   A static hostPath PV is created on node-0 at /var/lib/ollama/models.
#   The Deployment is pinned to node-0 via nodeSelector so the pod always
#   lands on the same node as the PV data — model weights survive pod restarts.
#
# Service is assigned a fixed ClusterIP because this KTHW cluster does not run
# CoreDNS. Open WebUI reaches Ollama at http://10.0.0.207:11434.
#
# After applying, pull your first model:
#   kubectl exec -it deploy/ollama -- ollama pull llama3.2
#   kubectl exec -it deploy/ollama -- ollama pull nomic-embed-text   # for RAG
#
# Typical model sizes (plan disk accordingly):
#   llama3.2:3b   ~2 GB    gemma3:4b     ~3 GB
#   llama3.2:8b   ~5 GB    mistral:7b    ~4 GB
#   llama3.1:8b   ~5 GB    phi4:14b      ~9 GB
#
# Storage note:
#   Module 17 creates node-0 with a 100 GB boot persistent disk, so this hostPath
#   PV reserves 70Gi for Ollama model data while leaving room for the OS,
#   Kubernetes binaries, logs, and container images.
#   If you override WORKER_BOOT_DISK_SIZE in module 17, keep this PV/PVC request
#   below the actual free space on node-0.
# ==============================================================================

# ------------------------------------------------------------------------------
# PersistentVolume — hostPath on node-0, 70 Gi reserved for model weights
# ------------------------------------------------------------------------------
apiVersion: v1
kind: PersistentVolume
metadata:
  name: ollama-models-pv
  labels:
    app: ollama
spec:
  capacity:
    storage: 70Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  # nodeAffinity restricts which node can bind this PV.
  # Must match the nodeSelector on the Deployment below.
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - node-0
  hostPath:
    path: /var/lib/ollama/models
    type: DirectoryOrCreate
---
# ------------------------------------------------------------------------------
# PersistentVolumeClaim
# ------------------------------------------------------------------------------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models-pvc
  labels:
    app: ollama
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 70Gi
  # Bind explicitly to the PV above (no dynamic provisioner in KTHW).
  volumeName: ollama-models-pv
  storageClassName: ""
---
# ------------------------------------------------------------------------------
# Deployment
# ------------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  labels:
    app: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      # Pin to node-0 so the pod always co-locates with the hostPath PV.
      nodeSelector:
        kubernetes.io/hostname: node-0
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434
              protocol: TCP
          env:
            # Ollama reads OLLAMA_MODELS to locate its model store.
            - name: OLLAMA_MODELS
              value: /models
          volumeMounts:
            - name: models
              mountPath: /models
          resources:
            requests:
              cpu: "2"
              memory: "8Gi"
            limits:
              cpu: "4"
              memory: "14Gi"
          readinessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-models-pvc
---
# ------------------------------------------------------------------------------
# Service — fixed ClusterIP from the live KTHW service CIDR (10.0.0.0/24).
# CoreDNS is not installed, so Open WebUI uses this IP directly.
# ------------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: ollama-service
  labels:
    app: ollama
spec:
  type: ClusterIP
  clusterIP: 10.0.0.207
  selector:
    app: ollama
  ports:
    - name: http
      port: 11434
      targetPort: 11434
      protocol: TCP

# ------------------------------------------------------------------------------
# NodePort fallback — use only if cross-node pod routing or ClusterIP breaks:
#   type: NodePort
#   ports:
#     - name: http
#       port: 11434
#       targetPort: 11434
#       nodePort: 31434
#       protocol: TCP
# Open WebUI fallback URL: http://10.240.0.20:31434
# ------------------------------------------------------------------------------
