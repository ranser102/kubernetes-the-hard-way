# ==============================================================================
# Open WebUI — Deployment + Service
#
# Topology (KTHW without CoreDNS / cross-node pod routing):
#   Ollama     → node-0  (ollama.yaml, NodePort 31434)
#   Open WebUI → node-1  (this file)
#
# OLLAMA_BASE_URL points at node-0's internal VPC IP + Ollama NodePort.
# This bypasses broken pod-to-pod routing (10.200.x → 10.200.x) after reboots
# and avoids pulling the ~2 GB image onto node-0's limited boot disk.
#
# Access Open WebUI:
#   kubectl port-forward svc/open-webui 8080:8080
#   open http://localhost:8080
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  labels:
    app: open-webui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      # Run on node-1 — image is pre-pulled there; Ollama stays on node-0.
      nodeSelector:
        kubernetes.io/hostname: node-1
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:main
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            # node-0 internal VPC IP (from provision-infra01.sh --private-network-ip)
            # + Ollama NodePort (ollama.yaml). No CoreDNS or pod CIDR routing needed.
            - name: OLLAMA_BASE_URL
              value: "http://10.240.0.20:31434"
          resources:
            requests:
              cpu: "1"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
---
# ------------------------------------------------------------------------------
# ClusterIP — use for port-forward testing (no firewall changes needed):
#   kubectl port-forward svc/open-webui 8080:8080
# ------------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  labels:
    app: open-webui
spec:
  type: ClusterIP
  selector:
    app: open-webui
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP

# ------------------------------------------------------------------------------
# NodePort — swap in when you are ready for browser access via node external IP:
#   http://<node-external-ip>:32000
#
# Steps:
#   1. Delete the ClusterIP service above (or replace this whole Service block)
#   2. Apply this NodePort service
#   3. Open firewall:
#        gcloud compute firewall-rules create kthw-allow-open-webui \
#          --network kubernetes-the-hard-way \
#          --allow tcp:32000 \
#          --source-ranges 0.0.0.0/0
#
# ---
# apiVersion: v1
# kind: Service
# metadata:
#   name: open-webui
#   labels:
#     app: open-webui
# spec:
#   type: NodePort
#   selector:
#     app: open-webui
#   ports:
#     - name: http
#       port: 8080
#       targetPort: 8080
#       nodePort: 32000
#       protocol: TCP
# ------------------------------------------------------------------------------
